<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RIMO - Smart Tank Monitor</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="manifest" href="manifest.json">
    
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>

    <style>
        .card { border: none; border-radius: 15px; transition: 0.3s; }
        .card:hover { transform: translateY(-5px); }
        #latest-img { width: 100%; height: auto; object-fit: cover; max-height: 400px; }
    </style>
</head>
<body class="bg-light">
    
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm mb-4">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold text-warning" href="index.html">🐠 RIMO Monitor</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto text-center">
                    <li class="nav-item"><a class="nav-link active" href="index.html">🏠 Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" href="camera.html">📷 Camera History</a></li>
                    <li class="nav-item"><a class="nav-link" href="ph.html">💧 pH History</a></li>
                    <li class="nav-item"><a class="nav-link" href="temp.html">🌡️ Temp History</a></li>
                    <li class="nav-item"><a class="nav-link" href="feeder.html">🐟 Feeder</a></li>
                    <li class="nav-item"><a class="nav-link text-danger" href="#" onclick="logout()">🚪 Logout</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div id="alert-zone"></div>

        <div class="row g-4">
            <div class="col-md-4 col-12">
                <div class="card shadow p-4 text-center">
                    <h5>Temperature</h5>
                    <h2 id="disp-temp" class="fw-bold">--°C</h2>
                    <small class="text-muted">Target: 18-26°C</small>
                </div>
            </div>

            <div class="col-md-4 col-12">
                <div class="card shadow p-4 text-center">
                    <h5>pH Level</h5>
                    <h2 id="disp-ph" class="fw-bold">--</h2>
                    <small class="text-muted">Target: 7.0-7.5</small>
                </div>
            </div>

            <div class="col-md-4 col-12">
                <div class="card shadow p-4 text-center">
                    <h5>ORP</h5>
                    <h2 id="disp-orp" class="fw-bold">-- mV</h2>
                    <small class="text-muted">N/A</small>
                </div>
            </div>

            <div class="col-md-8 col-12">
                <div class="card shadow p-4">
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <h5 class="mb-0">Latest Snap</h5>
                        <span id="snap-timestamp" class="badge bg-secondary">Waiting...</span>
                    </div>
                    <img id="latest-img" src="https://via.placeholder.com/600x400?text=Waiting+for+RIMO+Capture..." class="img-fluid rounded border">
                </div>
            </div>

            <div class="col-md-4 col-12">
                <div class="card shadow p-4 text-center bg-primary text-white">
                    <h5>Last Feed</h5>
                    <h3 id="last-feed" class="fw-bold">--:--</h3>
                    <p class="mb-0">Quantity: 3g Optimum</p>
                    <small>Schedule: Every 12 hours</small>
                </div>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    
    <script>
        // --- AUTH CHECK ---
        const userEmail = localStorage.getItem('rimo_email');
        if (!userEmail) {
            window.location.href = "login.html";
        }
        function logout() {
            localStorage.removeItem('rimo_email');
            window.location.href = 'login.html';
        }

        // --- EMAILJS INIT ---
        emailjs.init("TaAvoWcHSyIX4HQ37");

        // --- FIREBASE CONFIG ---
        const firebaseConfig = {
            apiKey: "AIzaSyBlFo_hv6jsDAJHIRY_6kLe8mPW-0rB8ME",
            authDomain: "rimo-4c770.firebaseapp.com",
            databaseURL: "https://rimo-4c770-default-rtdb.firebaseio.com",
            projectId: "rimo-4c770",
            storageBucket: "rimo-4c770.firebasestorage.app",
            messagingSenderId: "472011782582",
            appId: "1:472011782582:web:3ae7e6b069105c963f2917"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();


        // --- 1. TEMPERATURE (Reads from History) ---
        db.ref('temp_history').limitToLast(1).on('value', (snapshot) => {
            const data = snapshot.val(); 
            if (data) {
                const key = Object.keys(data)[0];
                const val = parseFloat(data[key].value);

                // Handle Sensor Disconnect Error
                if (val === -127) {
                    document.getElementById('disp-temp').innerText = "Err";
                    document.getElementById('alert-zone').innerHTML = `<div class="alert alert-warning shadow-sm">⚠️ <b>Check Wiring:</b> Temp Sensor disconnected (-127).</div>`;
                } else {
                    document.getElementById('disp-temp').innerText = val + "°C";

                    // Alert Logic
                    const alertZone = document.getElementById('alert-zone');
                    if (val < 18 || val > 28) {
                        alertZone.innerHTML = `<div class="alert alert-danger shadow-sm">⚠️ <b>Warning:</b> Tank temperature is ${val}°C. Check Heater!</div>`;
                        sendEmailAlert("Temperature", val + "°C", "Temperature Critical!", "last_temp_email");
                    } else {
                        if(!document.getElementById('alert-zone').innerHTML.includes("pH")) {
                            alertZone.innerHTML = ""; 
                        }
                    }
                }
            }
        });


        // --- 2. pH LISTENER (Reads from History) ---
        db.ref('ph_history').limitToLast(1).on('value', (snapshot) => {
            const data = snapshot.val();
            if (data) {
                const key = Object.keys(data)[0];
                const val = parseFloat(data[key].value);

                document.getElementById('disp-ph').innerText = val;

                // Alert Logic
                const alertZone = document.getElementById('alert-zone');
                if (val < 6.5 || val > 8.0) {
                    alertZone.innerHTML = `<div class="alert alert-danger shadow-sm">⚠️ <b>CRITICAL:</b> pH Level is ${val}! Water unsafe.</div>`;
                    sendEmailAlert("pH Level", val, "pH Unstable! Check Water.", "last_ph_email");
                }
            }
        });


        // --- 3. CAMERA LISTENER ---
        db.ref('image_urls').limitToLast(1).on('value', (snapshot) => {
            const data = snapshot.val();
            if (data) {
                const key = Object.keys(data)[0]; 
                const imageUrl = data[key];       
                document.getElementById('latest-img').src = imageUrl;
                document.getElementById('snap-timestamp').innerText = "Live Capture";
            }
        });


        // --- 4. FEEDER LISTENER ---
        // Reads from history to be safe
        db.ref('feeder_history').limitToLast(1).on('value', (snapshot) => {
            const data = snapshot.val();
            if (data) {
                const key = Object.keys(data)[0];
                if(data[key].time) {
                    document.getElementById('last-feed').innerText = data[key].time;
                }
            }
        });


        // --- HELPER: EMAIL SENDER ---
        function sendEmailAlert(paramName, val, msg, storageKey) {
            const lastSent = localStorage.getItem(storageKey);
            const now = Date.now();

            if (!lastSent || (now - lastSent > 3600000)) {
                emailjs.send("service_js0niy1", "template_fslbcqb", {
                    parameter: paramName,
                    current_value: val,
                    tank_type: "RIMO Goldfish Tank",
                    time: new Date().toLocaleTimeString(),
                    safe_range: "Normal Range",
                    message: msg,
                    user_email: userEmail
                }).then(() => {
                    console.log(`Email sent for ${paramName}`);
                    localStorage.setItem(storageKey, now);
                });
            }
        }

    </script>
</body>
</html>
