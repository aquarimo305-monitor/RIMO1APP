<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RIMO - Camera Archive</title>
    <link rel="manifest" href="manifest.json">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        .cam-card { border: none; border-radius: 15px; overflow: hidden; transition: 0.3s; height: 100%; }
        .cam-card:hover { transform: scale(1.02); }
        .img-container { position: relative; width: 100%; padding-top: 75%; /* 4:3 Aspect Ratio */ background: #eee; }
        .img-container img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
        .img-time { font-size: 0.85rem; font-weight: bold; color: #555; }
    </style>
</head>
<body class="bg-light">
    
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
      <div class="container">
        <a class="navbar-brand text-warning fw-bold" href="index.html">🐠 RIMO Archive</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto text-center">
            <li class="nav-item"><a class="nav-link" href="index.html">🏠 Dashboard</a></li>
            <li class="nav-item"><a class="nav-link active" href="camera.html">📷 Camera</a></li>
            <li class="nav-item"><a class="nav-link" href="ph.html">💧 pH History</a></li>
            <li class="nav-item"><a class="nav-link" href="temp.html">🌡️ Temp History</a></li>
            <li class="nav-item"><a class="nav-link" href="feeder.html">🐟 Feeder</a></li>
            <li class="nav-item"><a class="nav-link text-danger" href="#" onclick="logout()">🚪 Logout</a></li>
          </ul>
        </div>
      </div>
    </nav>

    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h3>📸 Camera Archive</h3>
            <span class="badge bg-info text-dark">Last 50 Snaps</span>
        </div>
        
        <div class="row g-4" id="camera-gallery">
            <div class="col-12 text-center" id="loading-msg">
                <div class="spinner-border text-primary" role="status"></div>
                <p class="mt-2">Loading photos from RIMO cloud...</p>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

    <script>
        // Logout Logic
        function logout() {
            localStorage.removeItem('rimo_email');
            window.location.href = 'login.html';
        }

        const firebaseConfig = {
            apiKey: "AIzaSyBlFo_hv6jsDAJHIRY_6kLe8mPW-0rB8ME",
            authDomain: "rimo-4c770.firebaseapp.com",
            databaseURL: "https://rimo-4c770-default-rtdb.firebaseio.com",
            projectId: "rimo-4c770",
            storageBucket: "rimo-4c770.firebasestorage.app",
            messagingSenderId: "472011782582",
            appId: "1:472011782582:web:3ae7e6b069105c963f2917"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // 2. FIXED PATH: 'image_urls' (Not camera_history)
        // We limit to last 50 to prevent crashing your phone with 1000s of images
        db.ref('image_urls').limitToLast(50).on('value', (snapshot) => {
            const gallery = document.getElementById('camera-gallery');
            gallery.innerHTML = ""; 
            
            const data = snapshot.val();
            
            if (data) {
                // Reverse to show NEWEST photos at the top
                const keys = Object.keys(data).reverse();
                
                keys.forEach(key => {
                    const imageUrl = data[key]; // In your DB, the value IS the url string
                    
                    // Simple logic to extract a "Fake Time" from filename if possible
                    // Your filename is typically: photo_123456.jpg
                    let displayTime = "Snapshot ID: " + key.substring(1, 6); 

                    const cardHtml = `
                        <div class="col-md-4 col-sm-6 col-12">
                            <div class="card cam-card shadow-sm">
                                <div class="img-container">
                                    <img src="${imageUrl}" alt="Tank Capture" loading="lazy">
                                </div>
                                <div class="card-body p-2 text-center bg-white">
                                    <span class="img-time">📂 ${displayTime}</span>
                                    <br>
                                    <a href="${imageUrl}" target="_blank" class="btn btn-link btn-sm p-0">View Full Size</a>
                                </div>
                            </div>
                        </div>
                    `;
                    gallery.insertAdjacentHTML('beforeend', cardHtml);
                });
            } else {
                gallery.innerHTML = "<div class='col-12 text-center text-muted'><p>No photos found in 'image_urls'.</p></div>";
            }
        });
    </script>
</body>
</html>
