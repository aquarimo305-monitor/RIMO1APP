<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RIMO - pH History</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <link rel="manifest" href="manifest.json">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
      <div class="container">
        <a class="navbar-brand text-warning fw-bold" href="index.html">🐠 RIMO Archive</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto text-center">
            <li class="nav-item"><a class="nav-link" href="index.html">🏠 Dashboard</a></li>
            <li class="nav-item"><a class="nav-link" href="camera.html">📷 Camera Gallery</a></li>
            <li class="nav-item"><a class="nav-link active" href="ph.html">💧 pH Graph</a></li>
            <li class="nav-item"><a class="nav-link" href="temp.html">🌡️ Temp Graph</a></li>
            <li class="nav-item"><a class="nav-link" href="feeder.html">🐟 Feeder Log</a></li>
            <li class="nav-item"><a class="nav-link text-danger" href="#" onclick="logout()">🚪 Logout</a></li>
          </ul>
        </div>
      </div>
    </nav>

    <div class="container mt-4">
        <div class="card shadow p-4">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h3>pH Level History</h3>
                <span id="tank-badge" class="badge bg-info text-dark">Detecting Tank Type...</span>
            </div>
            <canvas id="phChart" height="100"></canvas>
            <div id="ph-alert-msg" class="mt-3"></div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

    <script>
        // Logout Logic
        function logout() {
            localStorage.removeItem('rimo_email');
            window.location.href = 'login.html';
        }

        // 1. Initialize EmailJS
        emailjs.init("TaAvoWcHSyIX4HQ37"); 
        
        const userEmail = localStorage.getItem('rimo_email'); 
        const tankType = localStorage.getItem('rimo_tank_type') || 'freshwater'; 
        
        document.getElementById('tank-badge').innerText = tankType.toUpperCase();

        // 2. Define Safety Limits
        const limits = (tankType === 'saltwater') 
            ? { min: 8.1, max: 8.4 } 
            : { min: 7.0, max: 7.5 };

        // 3. Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyBlFo_hv6jsDAJHIRY_6kLe8mPW-0rB8ME",
            authDomain: "rimo-4c770.firebaseapp.com",
            databaseURL: "https://rimo-4c770-default-rtdb.firebaseio.com",
            projectId: "rimo-4c770",
            storageBucket: "rimo-4c770.firebasestorage.app",
            messagingSenderId: "472011782582",
            appId: "1:472011782582:web:3ae7e6b069105c963f2917"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // 4. Chart.js Setup
        const ctx = document.getElementById('phChart').getContext('2d');
        const phChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: [],
                datasets: [{
                    label: 'pH Level',
                    data: [],
                    borderColor: '#0dcaf0',
                    backgroundColor: 'rgba(13, 202, 240, 0.1)',
                    fill: true,
                    tension: 0.3
                }]
            },
            options: {
                scales: { 
                    y: { min: 4.0, max: 10.0 } 
                }
            }
        });

        // 5. Data Listener (READS FROM ph_history)
        let lastEmailSent = 0;

        db.ref('ph_history').limitToLast(20).on('value', (snapshot) => {
            const data = snapshot.val();
            const labels = [];
            const values = [];

            if (data) {
                Object.keys(data).forEach(key => {
                    const item = data[key];
                    // Ensure valid data exists
                    if (item.time && item.value) {
                        labels.push(item.time);
                        // Force value to be a number (Fixes graph issues)
                        values.push(parseFloat(item.value));
                    }
                });

                phChart.data.labels = labels;
                phChart.data.datasets[0].data = values;
                phChart.update();

                // Check Latest Value for Alerts
                const latestPh = values[values.length - 1];
                const alertDiv = document.getElementById('ph-alert-msg');

                if (latestPh < limits.min || latestPh > limits.max) {
                    alertDiv.innerHTML = `<div class="alert alert-warning">⚠️ Critical pH: ${latestPh}. Ideal: ${limits.min}-${limits.max}</div>`;
                    
                    // Send Warning Email (Limit: 1 per hour)
                    const now = Date.now();
                    if (now - lastEmailSent > 3600000 && userEmail) {
                        sendWarning(latestPh);
                        lastEmailSent = now;
                    }
                } else {
                    alertDiv.innerHTML = `<div class="alert alert-success">✅ pH is Stable (${latestPh})</div>`;
                }
            }
        });

        // 6. Email Function
        function sendWarning(val) {
            const now = new Date();
            const timeString = now.toLocaleTimeString('en-IN', { timeZone: 'Asia/Kolkata' });

            emailjs.send("service_js0niy1", "template_fslbcqb", {
                user_email: userEmail,       
                tank_type: tankType,       
                parameter: "pH Level",
                current_value: val,
                time: timeString,
                safe_range: `${limits.min}-${limits.max}`,
                message: `The pH level in your ${tankType} aquarium has drifted to ${val}.`
            }, "TaAvoWcHSyIX4HQ37").then(() => console.log("pH Warning Sent Email"));
        }
    </script>
</body>
</html>
