<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RIMO - Temperature Detail</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <link rel="manifest" href="manifest.json">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
      <div class="container">
        <a class="navbar-brand text-warning fw-bold" href="index.html">🐠 RIMO Archive</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto text-center">
            <li class="nav-item"><a class="nav-link" href="index.html">🏠 Dashboard</a></li>
            <li class="nav-item"><a class="nav-link" href="camera.html">📷 Camera</a></li>
            <li class="nav-item"><a class="nav-link" href="ph.html">💧 pH History</a></li>
            <li class="nav-item"><a class="nav-link active" href="temp.html">🌡️ Temp History</a></li>
            <li class="nav-item"><a class="nav-link" href="feeder.html">🐟 Feeder</a></li>
            <li class="nav-item"><a class="nav-link text-danger" href="#" onclick="logout()">🚪 Logout</a></li>
          </ul>
        </div>
      </div>
    </nav>

    <div class="container mt-4">
        <div class="card shadow p-4">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h3 id="chart-title">Temperature History (°C)</h3>
                <span id="tank-badge" class="badge bg-danger text-white">Live Data</span>
            </div>
            <canvas id="tempChart" height="100"></canvas>
            <div id="temp-alert-msg" class="mt-3"></div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

    <script>
        // Logout Logic
        function logout() {
            localStorage.removeItem('rimo_email');
            window.location.href = 'login.html';
        }

        // Initialize EmailJS immediately
        emailjs.init("TaAvoWcHSyIX4HQ37"); 
        
        const userEmail = localStorage.getItem('rimo_email'); 
        const tankType = localStorage.getItem('rimo_tank_type') || 'freshwater'; 
        
        const firebaseConfig = {
            apiKey: "AIzaSyBlFo_hv6jsDAJHIRY_6kLe8mPW-0rB8ME",
            authDomain: "rimo-4c770.firebaseapp.com",
            databaseURL: "https://rimo-4c770-default-rtdb.firebaseio.com",
            projectId: "rimo-4c770",
            storageBucket: "rimo-4c770.firebasestorage.app",
            messagingSenderId: "472011782582",
            appId: "1:472011782582:web:3ae7e6b069105c963f2917"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // Safe thresholds for Kolkata Winter
        const limits = (tankType === 'saltwater') 
            ? { min: 24, max: 28 } : { min: 18, max: 26 };

        const ctx = document.getElementById('tempChart').getContext('2d');
        const chart = new Chart(ctx, {
            type: 'line',
            data: { 
                labels: [], 
                datasets: [{ 
                    label: 'Temperature (°C)', 
                    data: [], 
                    borderColor: '#ff6384', 
                    backgroundColor: 'rgba(255, 99, 132, 0.1)',
                    fill: true,
                    tension: 0.3 
                }] 
            },
            options: { scales: { y: { min: 15, max: 32 } } }
        });

        let lastEmailTime = 0;
        
        // Listen to 'temp_history'
        db.ref('temp_history').limitToLast(12).on('value', (snapshot) => {
            const data = snapshot.val();
            if (!data) return;

            const labels = []; 
            const values = [];
            
            Object.keys(data).forEach(key => {
                // Ensure we skip any 'init' keys and have valid data
                if (data[key].time && data[key].value) {
                    labels.push(data[key].time);
                    values.push(data[key].value);
                }
            });

            chart.data.labels = labels;
            chart.data.datasets[0].data = values;
            chart.update();

            // Alert Logic
            const latestVal = values[values.length - 1];
            const alertDiv = document.getElementById('temp-alert-msg');

            if (latestVal < limits.min || latestVal > limits.max) {
                 alertDiv.innerHTML = `<div class="alert alert-danger">⚠️ <b>Warning:</b> Temp is ${latestVal}°C. Safe range: ${limits.min}-${limits.max}°C.</div>`;

                if (Date.now() - lastEmailTime > 3600000 && userEmail) {
                    sendWarning("Temperature", latestVal);
                    lastEmailTime = Date.now();
                }
            } else {
                alertDiv.innerHTML = `<div class="alert alert-success">✅ Temperature is Optimal (${latestVal}°C)</div>`;
            }
        });

        function sendWarning(param, val) {
            const now = new Date();
            const timeString = now.toLocaleTimeString('en-IN', { timeZone: 'Asia/Kolkata' });

            emailjs.send("service_js0niy1", "template_fslbcqb", {
                user_email: userEmail,
                parameter: param,
                current_value: val,
                tank_type: tankType,
                time: timeString,
                safe_range: `${limits.min}-${limits.max}°C`,
                message: `Warning! Your ${tankType} tank temperature is ${val}°C. Please check the heater immediately.`
            }, "TaAvoWcHSyIX4HQ37");
        }
    </script>
</body>
</html>
